# V2.3 commercial hardening: reusable root web-server protections
# Safe to version-control: contains no secrets or hosting-specific credentials.

<FilesMatch "^(BATCH_NOTES\.txt|RELEASE_NOTES\.txt|database_schema\.sql)$">
    Require all denied
</FilesMatch>

# Portable baseline security headers. CSP is intentionally deferred until
# external scripts/assets/payment flows are fully audited.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>
