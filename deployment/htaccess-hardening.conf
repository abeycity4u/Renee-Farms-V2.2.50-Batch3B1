# V2.3 commercial hardening: reusable root web-server protections
# Safe to version-control: contains no secrets or hosting-specific credentials.

# Canonical HTTPS + non-www host routing.
<IfModule mod_rewrite.c>
    RewriteEngine On

    RewriteCond %{HTTPS} !=on [OR]
    RewriteCond %{HTTP_HOST} !^reneefarms\.com$ [NC]
    RewriteRule ^ https://reneefarms.com%{REQUEST_URI} [R=301,L]
</IfModule>

# App-controlled generic error pages avoid exposing server-branded defaults.
ErrorDocument 403 /errors/403.php
ErrorDocument 404 /errors/404.php

<FilesMatch "^(BATCH_NOTES\.txt|RELEASE_NOTES\.txt|database_schema\.sql)$">
    Require all denied
</FilesMatch>

# Portable baseline security headers. CSP is intentionally deferred until
# external scripts/assets/payment flows are fully audited.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Reduce unnecessary implementation fingerprinting.
    Header always unset X-Powered-By
</IfModule>

# Reject HTTP methods not used by the public web application.
# OPTIONS remains allowed for legitimate browser/preflight behavior.
<IfModule mod_rewrite.c>
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK|PUT|DELETE|PATCH)$ [NC]
    RewriteRule ^ - [R=405,L]
</IfModule>
