name: C137 GC24 K2-P03 isolated MariaDB B12

# DORMANT. No workflow_dispatch or pull_request trigger.
# Only a NEW one-file B12 approval commit can reach this test.
# B12 SOURCE-ONLY changes and audit docs MUST NOT trigger a run.
on:
  push:
    branches:
      - c137-gc24-k2p03-ci-mariadb-b12
    paths:
      - docs/C137_GC24_K2_P03_B12_EXECUTION_APPROVAL.txt

permissions:
  contents: read

concurrency:
  group: k2p03-b12-mariadb-isolated
  cancel-in-progress: false

jobs:
  b12-real-mariadb:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/c137-gc24-k2p03-ci-mariadb-b12' &&
      github.event.head_commit.message == 'ci-b12(run): authorize isolated B12' &&
      github.run_attempt == 1
    name: B12 two-process source-correction locks (real MariaDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_K2P03_SCENARIO_ALLOWED: 'B12'
      CI_DB_HOST: '127.0.0.1'
      CI_DB_PORT: '3306'
      CI_DB_NAME: 'renee_k2p03_ci_b12'
      CI_DB_USER: 'ci_k2p03'
      CI_DB_PASSWORD: 'ci-only-nonsecret-b12'

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-nonsecret-b12
          MARIADB_DATABASE: renee_k2p03_ci_b12
          MARIADB_USER: ci_k2p03
          MARIADB_PASSWORD: ci-only-nonsecret-b12
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact isolated B12 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fail-closed newly-added one-file B12 authorization
        shell: bash
        run: |
          set -euo pipefail
          APPROVAL='docs/C137_GC24_K2_P03_B12_EXECUTION_APPROVAL.txt'
          test "$GITHUB_REF" = 'refs/heads/c137-gc24-k2p03-ci-mariadb-b12'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git show -s --format=%s HEAD)" = 'ci-b12(run): authorize isolated B12'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$APPROVAL"
          test "$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD)" = "$APPROVAL"
          test "$(wc -l < "$APPROVAL" | tr -d ' ')" = '2'
          test "$(sed -n '1p' "$APPROVAL")" = 'CI_B12_EXECUTION_APPROVED=YES'
          test "$(sed -n '2p' "$APPROVAL")" = "CI_B12_APPROVED_PARENT=$(git rev-parse HEAD^)"
          test "$(sed -n '3p' "$APPROVAL")" = ''
          test "$(git rev-parse HEAD^)" != ''
          echo 'CI_B12_ONE_USE_APPROVAL_GUARD=PASS'

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Install MariaDB client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends mariadb-client

      - name: Verify isolated identity, exact source blobs and empty disposable schema
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$GITHUB_REPOSITORY" = 'abeycity4u/Renee-Farms-V2.2.50-Batch3B1'
          test "$GITHUB_REF" = 'refs/heads/c137-gc24-k2p03-ci-mariadb-b12'
          test "$CI_K2P03_SCENARIO_ALLOWED" = 'B12'
          test "$CI_DB_HOST" = '127.0.0.1'
          test "$CI_DB_PORT" = '3306'
          test "$CI_DB_NAME" = 'renee_k2p03_ci_b12'
          test "$CI_DB_USER" = 'ci_k2p03'
          test "$CI_DB_PASSWORD" = 'ci-only-nonsecret-b12'
          test "$(git hash-object database_schema.sql)" = 'e77f287d62c5812a3d55dc23b5b20f5d167db389'
          test "$(git hash-object poultry/layers_daily_record.php)" = '87b7c6ace9bd577ad2303ea4aa50312a780412d2'
          test "$(git hash-object lib/daily_population_continuity.php)" = '9503771b47c6c2fe26bb3237da69a17874e724a3'
          test "$(git hash-object lib/daily_population_boundary.php)" = '38b346a177788a439355cd18205ab16c47065310'
          test "$(git hash-object lib/production_population.php)" = 'fff1b3e663bb0845c34ccf734a52f6c92eaae706'
          test "$(git hash-object lib/production_population_projection.php)" = 'c4cdae4c193b624a7469915e0451d41fef1b2f4b'
          test "$(git hash-object lib/daily_population_sync.php)" = 'ff4b045000910af222c5203347419c7a7cb66e6a'
          test "$(git hash-object lib/daily_feed_sync.php)" = '752707749fea0583249ec600bb5d624d416b8a47'
          test "$(git hash-object lib/stock_consumption_source_resolver.php)" = 'd9eeaeb53225f3ac1797d5065cc15bb773558200'
          test "$(git hash-object lib/stock_service.php)" = 'b9e7b021020ffaa92fa201800572451f8762d520'
          test "$(git hash-object lib/sales_allocation.php)" = '1a701fff059189b6a9ad3fe1a190188be958a96b'
          test "$(git hash-object tests/integration/k2p03_ci_isolation.php)" = '6f783f07bc46811bb53a1b3c9b40262341ed771f'
          test "$(git hash-object tests/integration/k2p03_b12_real_mariadb.php)" = '67e9c98c22d48daee9d9c0db266c0cc89613439a'
          test "$(MYSQL_PWD="$CI_DB_PASSWORD" mariadb --protocol=TCP --host="$CI_DB_HOST" --port="$CI_DB_PORT" --user="$CI_DB_USER" --database="$CI_DB_NAME" --batch --skip-column-names --execute="SELECT DATABASE()")" = "$CI_DB_NAME"
          test "$(MYSQL_PWD="$CI_DB_PASSWORD" mariadb --protocol=TCP --host="$CI_DB_HOST" --port="$CI_DB_PORT" --user="$CI_DB_USER" --database="$CI_DB_NAME" --batch --skip-column-names --execute="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_type='BASE TABLE'")" = '0'
          echo 'EPHEMERAL_DATABASE_IDENTITY=PASS'
          echo 'EPHEMERAL_SCHEMA_INITIAL_EMPTY=PASS'
          echo 'PINNED_SOURCE_AND_SCHEMA=PASS'

      - name: Import schema only into confirmed empty synthetic B12 database
        shell: bash
        run: |
          set -euo pipefail
          # Pinned dump contains DROP TABLE; it is permitted only after the
          # EXACT host, DB, source blobs and zero-tables guard just passed.
          MYSQL_PWD="$CI_DB_PASSWORD" mariadb --protocol=TCP --host="$CI_DB_HOST" --port="$CI_DB_PORT" --user="$CI_DB_USER" --database="$CI_DB_NAME" < database_schema.sql
          echo 'EPHEMERAL_SCHEMA_IMPORT=COMPLETE'

      - name: Lint and run B12 independent-process real-MariaDB contract
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/integration/k2p03_ci_isolation.php
          php -l tests/integration/k2p03_b12_real_mariadb.php
          php tests/integration/k2p03_b12_real_mariadb.php --controller
