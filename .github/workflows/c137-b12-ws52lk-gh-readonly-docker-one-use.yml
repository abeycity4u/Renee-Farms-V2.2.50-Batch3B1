name: "C137 B12 WS52-LK single-use read-only Docker runner preflight"

# FROZEN SOURCE-ONLY DIAGNOSTIC PATCH ON WS52-LM FEATURE BRANCH.
# Literal if:false means NO execution, even with an approval-path push.
# WS52-LK previous one-use authorization has already been consumed.
# Original scope: disposable GitHub-hosted runner metadata preflight.
# No checkout action, services, image pulls, containers, volumes, SQL, backup,
# registry/CDN, production/staging, migration or concurrency execution.
# This workflow has a single-use exact-branch/approval-path/commit-message gate.
on:
  push:
    branches:
      - c137-gc24-k2p03-b12-ws52lk-gh-readonly-docker-preflight
    paths:
      - docs/C137_GC24_K2_P03_B12_WS52LK_READONLY_PREFLIGHT_ONE_USE_APPROVAL.txt

permissions: {}

concurrency:
  group: c137-b12-ws52lk-single-readonly-preflight
  cancel-in-progress: false

jobs:
  docker-readonly-preflight:
    # WS52-LK one-use attempt is CONSUMED; this source-only successor is inert.
    # A future independently reviewed, newly authorized workflow is required.
    if: ${{ false }}
    name: "One-use GitHub-hosted Docker metadata inspection (NO MUTATION)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Validate one-use approval event; inspect runner and Docker read-only"
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json
          import os
          import re
          import stat
          import subprocess
          import sys

          REPO = "abeycity4u/Renee-Farms-V2.2.50-Batch3B1"
          REF = "refs/heads/c137-gc24-k2p03-b12-ws52lk-gh-readonly-docker-preflight"
          APPROVAL = "docs/C137_GC24_K2_P03_B12_WS52LK_READONLY_PREFLIGHT_ONE_USE_APPROVAL.txt"
          MESSAGE = "ci-b12(ws52lk-run): approve one readonly Docker preflight"
          audit = {
              "ONE_USE_EVENT_GUARD": "NOT_VERIFIED",
              "GITHUB_HOSTED_RUNNER_CLAIM": "NOT_VERIFIED",
              "DOCKER_LOCAL_UNIX_SOCKET": "NOT_VERIFIED",
              "DOCKER_READONLY_COMMANDS": "NOT_RUN",
              "ENGINE_METADATA_READ": "NO",
              "ENGINE_ID_PRESENT": "NOT_VERIFIED",
              "DOCKER_CONTAINERS_EXIST": "NOT_VERIFIED",
              "DOCKER_VOLUMES_EXIST": "NOT_VERIFIED",
              "UNEXPECTED_NETWORKS_EXIST": "NOT_VERIFIED",
              "TCP_3306_LISTENER": "NOT_VERIFIED",
          }

          def emit(result, reason):
              print("#####COPY FROM HERE#####")
              print("AUDIT=B12_WS52LK_GITHUB_READONLY_PHYSICAL_PREFLIGHT")
              print("RESULT=" + result)
              print("REASON=" + reason)
              for key, val in audit.items():
                  print(key + "=" + val)
              print("RUNNER_PROVENANCE=SELF_REPORTED_GITHUB_HOSTED_ONLY")
              print("ENGINE_PROVENANCE=DAEMON_SELF_REPORTED_ONLY")
              print("INDEPENDENT_ATTESTOR=NOT_ESTABLISHED")
              print("EGRESS_ISOLATION=NOT_ATTESTED")
              print("DOCKER_BROKER_PRIVILEGE_SEPARATION=NOT_CERTIFIED")
              print("IMAGE_DOWNLOADS=NO")
              print("REGISTRY_REQUESTS=0")
              print("CONTAINERS_CREATED=0")
              print("CONTAINERS_REMOVED=0")
              print("VOLUMES_CREATED=0")
              print("VOLUMES_REMOVED=0")
              print("DATABASE_CONNECTIONS=0")
              print("SQL_EXECUTED=NO")
              print("CUSTOMER_DATA_ACCESSED=NO")
              print("RC01_WORKERS_EXECUTED=NO")
              print("RUNTIME_RC01_APPROVAL=NOT_GRANTED")
              print("REPAIRED_RC01_RC14_CERTIFIED_PASSES=0")
              print("MIGRATION_092=NOT_AUTHORIZED")
              print("B12_CUTOVER=HARD_OFF")
              print("#####COPY TO HERE#####")
              sys.stdout.flush()

          class GuardReject(Exception):
              """Owns a constant non-sensitive diagnostic code, never input data."""
              def __init__(self, code):
                  self.code = code

          def require(valid, code):
              if not valid:
                  raise GuardReject(code)

          def guard():
              # Order matters: each step returns exactly one fixed reason code.
              require(os.environ.get("GITHUB_ACTIONS") == "true",
                      "ENV_GITHUB_ACTIONS")
              require(os.environ.get("GITHUB_EVENT_NAME") == "push",
                      "ENV_EVENT_NOT_PUSH")
              require(os.environ.get("GITHUB_REPOSITORY") == REPO,
                      "ENV_REPOSITORY_MISMATCH")
              require(os.environ.get("GITHUB_REF") == REF,
                      "ENV_REF_MISMATCH")
              require(os.environ.get("GITHUB_RUN_NUMBER") == "1",
                      "ENV_RUN_NUMBER_NOT_ONE")
              require(os.environ.get("GITHUB_RUN_ATTEMPT") == "1",
                      "ENV_RUN_ATTEMPT_NOT_ONE")
              require(os.environ.get("RUNNER_OS") == "Linux",
                      "RUNNER_OS_UNEXPECTED")
              require(os.environ.get("RUNNER_ARCH") == "X64",
                      "RUNNER_ARCH_UNEXPECTED")
              require(os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted",
                      "RUNNER_ENVIRONMENT_UNVERIFIED")
              sha = os.environ.get("GITHUB_SHA")
              require(type(sha) is str and
                      re.fullmatch(r"[a-f0-9]{40}", sha) is not None,
                      "ENV_HEAD_SHA_INVALID")
              event_path = os.environ.get("GITHUB_EVENT_PATH")
              require(type(event_path) is str and bool(event_path),
                      "EVENT_PATH_MISSING")
              try:
                  with open(event_path, "rb") as stream:
                      raw = stream.read(262145)
              except OSError:
                  raise GuardReject("EVENT_FILE_UNREADABLE") from None
              require(0 < len(raw) <= 262144, "EVENT_BYTES_OUT_OF_BOUNDS")
              try:
                  event = json.loads(raw.decode("utf-8", "strict"))
              except (UnicodeError, ValueError, TypeError):
                  raise GuardReject("EVENT_JSON_INVALID") from None
              require(type(event) is dict, "EVENT_ROOT_NOT_OBJECT")
              head = event.get("head_commit")
              require(type(head) is dict, "EVENT_HEAD_COMMIT_MISSING")
              require(head.get("id") == sha, "EVENT_COMMIT_SHA_MISMATCH")
              require(head.get("message") == MESSAGE,
                      "EVENT_COMMIT_MESSAGE_MISMATCH")
              require(head.get("added") == [APPROVAL],
                      "EVENT_ADDED_FILES_MISMATCH")
              require(head.get("modified") == [],
                      "EVENT_MODIFIED_FILES_MISMATCH")
              require(head.get("removed") == [],
                      "EVENT_REMOVED_FILES_MISMATCH")
              commits = event.get("commits")
              require(type(commits) is list and len(commits) == 1,
                      "EVENT_COMMIT_COUNT_NOT_ONE")
              require(event.get("ref") == REF, "EVENT_REF_MISMATCH")
              require(event.get("deleted") is False,
                      "EVENT_DELETED_OR_MISSING")
              repository = event.get("repository")
              require(type(repository) is dict and
                      repository.get("full_name") == REPO,
                      "EVENT_REPOSITORY_MISMATCH")
              before = event.get("before")
              require(type(before) is str and
                      re.fullmatch(r"[a-f0-9]{40}", before) is not None and
                      before != "0" * 40, "EVENT_BEFORE_SHA_INVALID")
              audit["ONE_USE_EVENT_GUARD"] = "PASS"
              audit["GITHUB_HOSTED_RUNNER_CLAIM"] = "PASS_SELF_REPORTED"

          def readonly(*args):
              approved = {
                  ("version", "--format", "{{json .Server}}"),
                  ("info", "--format", "{{json .}}"),
                  ("container", "ls", "--all", "--no-trunc", "--quiet"),
                  ("volume", "ls", "--quiet"),
                  ("network", "ls", "--format", "{{json .}}"),
              }
              assert args in approved
              proc = subprocess.run(
                  ["/usr/bin/docker", *args],
                  shell=False,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=12,
                  check=False,
              )
              assert proc.returncode == 0
              assert len(proc.stdout) <= 131072
              return proc.stdout.decode("utf-8", "strict")

          def check_listener():
              # Host-kernel metadata only. Never open a TCP connection.
              for filename in ("/proc/net/tcp", "/proc/net/tcp6"):
                  with open(filename, "rt", encoding="ascii") as f:
                      next(f)
                      for line in f:
                          fields = line.split()
                          if len(fields) < 4:
                              continue
                          port = int(fields[1].split(":")[-1], 16)
                          if port == 3306 and fields[3] == "0A":
                              return True
              return False

          try:
              guard()
              assert not os.environ.get("DOCKER_CONTEXT")
              assert os.environ.get("DOCKER_HOST", "") in ("", "unix:///var/run/docker.sock")
              assert not os.environ.get("DOCKER_TLS_VERIFY")
              assert not os.environ.get("DOCKER_CERT_PATH")
              assert os.path.exists("/usr/bin/docker")
              assert not os.path.islink("/var/run/docker.sock")
              assert stat.S_ISSOCK(os.stat("/var/run/docker.sock").st_mode)
              audit["DOCKER_LOCAL_UNIX_SOCKET"] = "PRESENT"
              version = json.loads(readonly("version", "--format", "{{json .Server}}"))
              info = json.loads(readonly("info", "--format", "{{json .}}"))
              assert type(version) is dict and type(info) is dict
              assert isinstance(info.get("ID"), str) and bool(info["ID"])
              assert isinstance(version.get("Version"), str) and bool(version["Version"])
              assert isinstance(info.get("ServerVersion"), str)
              assert info["ServerVersion"] == version["Version"]
              audit["ENGINE_METADATA_READ"] = "YES_DOCKER_CLI"
              audit["ENGINE_ID_PRESENT"] = "YES_DAEMON_SELF_REPORTED"
              containers = [x for x in readonly("container", "ls", "--all", "--no-trunc", "--quiet").splitlines() if x]
              volumes = [x for x in readonly("volume", "ls", "--quiet").splitlines() if x]
              networks = [json.loads(line) for line in readonly("network", "ls", "--format", "{{json .}}").splitlines() if line]
              assert all(type(n) is dict and isinstance(n.get("Name"), str) for n in networks)
              names = {n["Name"] for n in networks}
              audit["DOCKER_READONLY_COMMANDS"] = "PASS"
              audit["DOCKER_CONTAINERS_EXIST"] = "YES" if containers else "NO"
              audit["DOCKER_VOLUMES_EXIST"] = "YES" if volumes else "NO"
              audit["UNEXPECTED_NETWORKS_EXIST"] = "YES" if (names - {"bridge", "host", "none"}) else "NO"
              audit["TCP_3306_LISTENER"] = "YES" if check_listener() else "NO"
              if containers or volumes or (names - {"bridge", "host", "none"}):
                  emit("BLOCKED", "PREEXISTING_DOCKER_RESOURCES_PRESENT")
                  sys.exit(2)
              if audit["TCP_3306_LISTENER"] != "NO":
                  emit("BLOCKED", "LOCAL_TCP_3306_IN_USE")
                  sys.exit(2)
              emit("READONLY_OBSERVATION_PASS", "NONE")
          except GuardReject as issue:
              # This code is selected from source constants only.
              emit("BLOCKED", issue.code)
              sys.exit(2)
          except Exception:
              # Never reflect stderr, host metadata, paths or raw JSON.
              emit("BLOCKED", "UNEXPECTED_DOCKER_PREFLIGHT_FAILURE")
              sys.exit(2)
          PY
